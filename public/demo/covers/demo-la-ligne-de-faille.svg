<!-- Couverture de démonstration — aucun contenu réel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-hidden="true">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="usure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="#e8dcc6"/>
  <rect width="400" height="600" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:multiply"/>
  <rect width="400" height="600" fill="url(#usure)"/>

  <!-- Réglure d'imprimeur, masquée en bas -->
  <g stroke="#2f2a24" stroke-width="0.6" opacity="0.14">
    <line x1="46" y1="96" x2="354" y2="96"/><line x1="46" y1="122" x2="354" y2="122"/><line x1="46" y1="148" x2="354" y2="148"/><line x1="46" y1="174" x2="354" y2="174"/><line x1="46" y1="200" x2="354" y2="200"/><line x1="46" y1="226" x2="354" y2="226"/><line x1="46" y1="252" x2="354" y2="252"/><line x1="46" y1="278" x2="354" y2="278"/><line x1="46" y1="304" x2="354" y2="304"/><line x1="46" y1="330" x2="354" y2="330"/><line x1="46" y1="356" x2="354" y2="356"/><line x1="46" y1="382" x2="354" y2="382"/><line x1="46" y1="408" x2="354" y2="408"/><line x1="46" y1="434" x2="354" y2="434"/><line x1="46" y1="460" x2="354" y2="460"/><line x1="46" y1="486" x2="354" y2="486"/><line x1="46" y1="512" x2="354" y2="512"/><line x1="46" y1="538" x2="354" y2="538"/>
  </g>
  <rect x="46" y="392" width="308" height="160" fill="#e8dcc6" opacity="0.94"/>

  <!-- Filets de cadre -->
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#a8895c" stroke-width="1"/>
  <rect x="36" y="36" width="328" height="528" fill="none" stroke="#a8895c" stroke-width="0.4" opacity="0.65"/>

  <line x1="46" y1="182" x2="120" y2="182" stroke="#a8895c" stroke-width="1.6"/>

  <text x="200" y="228" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="500" fill="#2f2a24">
      <tspan x="200" dy="0">La Ligne de</tspan>
      <tspan x="200" dy="46">faille</tspan>
  </text>

  <text x="200" y="366" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15" letter-spacing="2.4" fill="#a8895c">NORA BERKANE</text>

  <text x="200" y="524" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="3.6" fill="#2f2a24" opacity="0.45">SPÉCIMEN</text>
  <text x="200" y="548" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" letter-spacing="5" fill="#2f2a24" opacity="0.6">BARMAJATA</text>
</svg>
