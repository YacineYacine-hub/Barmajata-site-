<!-- Couverture de démonstration — aucun contenu réel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#2c3b4d"/>
      <stop offset="100%" stop-color="#18222e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#fond)"/>

  <!-- Arête gauche : l'objet a une épaisseur. Deux valeurs seulement, pas
       de tranche ornementée — un objet posé dans le vide a une arête, il
       n'a pas de décor. -->
  <rect x="0" y="0" width="11" height="600" fill="#000" opacity="0.30"/>
  <rect x="11" y="0" width="1.5" height="600" fill="#fff" opacity="0.14"/>

  <!-- Titre au fer à gauche, généreux, sans ornement -->
  <text x="46" y="150" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="400" fill="#f5f1e9" letter-spacing="-0.4">
      <tspan x="46" dy="0">La Ligne de</tspan>
      <tspan x="46" dy="44">faille</tspan>
  </text>

  <!-- Filet d'accent, unique -->
  <line x1="46" y1="500" x2="86" y2="500" stroke="#e2cba6" stroke-width="2"/>

  <text x="46" y="532" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6" fill="#f5f1e9" opacity="0.85">NORA BERKANE</text>
  <text x="46" y="556" font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="2.6" fill="#f5f1e9" opacity="0.4">SPÉCIMEN</text>
</svg>
