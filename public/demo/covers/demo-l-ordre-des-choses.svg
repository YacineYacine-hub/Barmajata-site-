<!-- Couverture de démonstration — aucun contenu réel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-hidden="true">
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="tranche" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="82%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.26"/>
    </radialGradient>
    <linearGradient id="lumiere" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="46%" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="#ded8c8"/>
  <rect width="400" height="600" fill="url(#lumiere)"/>
  <rect width="400" height="600" filter="url(#fibre)" opacity="0.13" style="mix-blend-mode:multiply"/>

  <!-- Double filet de cadre, net -->
  <rect x="28" y="28" width="344" height="544" fill="none" stroke="#8a8560" stroke-width="1.2" opacity="0.9"/>
  <rect x="34" y="34" width="332" height="532" fill="none" stroke="#8a8560" stroke-width="0.5" opacity="0.55"/>

  <!-- Filet court au-dessus du titre -->
  <line x1="168" y1="171" x2="232" y2="171" stroke="#8a8560" stroke-width="1.6"/>

  <!-- Titre gaufré : copie claire décalée, puis l'encre -->
  <text x="200" y="230" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="500" fill="#ffffff" opacity="0.22">
      <tspan x="201" dy="0">L'Ordre des</tspan>
      <tspan x="201" dy="44">choses</tspan>
  </text>
  <text x="200" y="229" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="500" fill="#2f2f28">
      <tspan x="200" dy="0">L'Ordre des</tspan>
      <tspan x="200" dy="44">choses</tspan>
  </text>

  <text x="200" y="361" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" letter-spacing="2.8" fill="#8a8560">BASTIEN KEROUAC</text>

  <!-- Marque de l'éditeur : cercle, courbe de livre ouvert, point d'or -->
  <g transform="translate(200 492) scale(0.30)" opacity="0.85">
    <circle cx="0" cy="0" r="56.32" fill="none" stroke="#2f2f28" stroke-width="3.4"/>
    <path d="M-15.94 -11.83 Q0 17.57 15.94 -11.83" fill="none" stroke="#2f2f28" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="0" cy="7.77" r="4.6" fill="#8a8560"/>
  </g>

  <text x="200" y="546" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="8.5" letter-spacing="3.8" fill="#2f2f28" opacity="0.42">SPÉCIMEN</text>

  <!-- Tranche : le livre a une épaisseur -->
  <rect x="0" y="0" width="17" height="600" fill="url(#tranche)"/>
  <line x1="17.5" y1="0" x2="17.5" y2="600" stroke="#fff" stroke-opacity="0.13" stroke-width="1"/>

  <rect width="400" height="600" fill="url(#vignette)"/>
</svg>
