# nginx en façade. À poser dans /etc/nginx/sites-available/barmajata,
# puis lier dans sites-enabled et recharger.
#
# Certbot ajoute lui-même les directives TLS lors de
#   sudo certbot --nginx -d barmajata.com -d www.barmajata.com
#
# ⚠ LE PIÈGE DE CE FICHIER — à lire avant d'y toucher.
#
# Les en-têtes de sécurité du site (HSTS, CSP, Referrer-Policy…) sont
# produits par Next lui-même, dans next.config.ts. nginx doit les
# RELAYER, pas les recréer. Deux erreurs classiques :
#
#   1. ajouter ici un `add_header` qui fait doublon — un navigateur qui
#      reçoit deux CSP applique l'INTERSECTION des deux, ce qui casse
#      silencieusement des pages ;
#   2. ajouter un `add_header` dans un bloc `location` — en nginx, un
#      `add_header` dans un bloc enfant ANNULE tous ceux du parent.
#
# Donc : aucun `add_header` de sécurité ici. Si un jour il en faut un,
# le mettre dans next.config.ts, pas dans ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name barmajata.com www.barmajata.com;

    # Certbot pose sa réponse de vérification ici.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barmajata.com www.barmajata.com;

    # Les certificats sont écrits par Certbot.
    # ssl_certificate     /etc/letsencrypt/live/barmajata.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/barmajata.com/privkey.pem;

    # La signature du serveur n'apprend rien d'utile à un visiteur, et
    # beaucoup à qui cherche une version vulnérable.
    server_tokens off;

    # Les fichiers du build ont un nom qui change à chaque version : ils
    # peuvent donc être mis en cache indéfiniment, sans risque de servir
    # une version périmée.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sans cet en-tête, l'application se croit en HTTP et peut
        # fabriquer des URL absolues en clair — y compris le lien de
        # confirmation du club, qui deviendrait inutilisable.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }

    # Un envoi volumineux n'a aucune raison d'exister sur ce site.
    client_max_body_size 2m;
}
