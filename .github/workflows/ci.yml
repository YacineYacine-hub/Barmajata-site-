name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      # Les tests avant le build : ils durent deux dixièmes de seconde et
      # portent sur la logique qui décide de ce qu'un visiteur voit et de
      # ce qu'un jeton de confirmation accepte. Échouer ici coûte moins
      # cher qu'échouer après trois minutes de build.
      - run: npm test

      # `next build` imprime certaines erreurs et sort quand même en 0 :
      # une clé de traduction manquante produit « Error: MISSING_MESSAGE »
      # pendant la génération statique sans faire échouer le build. Se fier
      # au seul code de sortie a laissé passer des pages incomplètes au
      # Lot F. On inspecte donc aussi la sortie.
      #
      # Mêmes motifs que .claude/push-si-vert.sh, qui applique le contrôle
      # en local avant un push. Voir CLAUDE.md, « Piège : next build sort
      # en 0 malgré des erreurs ».
      - name: Build (échoue aussi sur une erreur signalée en code 0)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -nE 'MISSING_MESSAGE|^Error:|^[[:space:]]*⨯' build.log; then
            echo "::error::Le build a signalé les erreurs ci-dessus malgré un code de sortie 0."
            exit 1
          fi
